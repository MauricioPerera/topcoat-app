[package]
name = "topcoat-app"
version = "0.1.0"
edition = "2024"

[dependencies]
# Topcoat no esta publicado en crates.io, asi que se consume por git. El rev queda
# FIJO a proposito: este proyecto es un ejemplo reproducible, y seguir la rama haria
# que compilara distinto segun el dia. Para desarrollar contra un clon local, usa un
# override en .cargo/config.toml (paths = [...]) en vez de editar esta linea.
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "ca0903338ea00ba1bd7495525ac7c687cd4971b7" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# `knowledge/contracts/format-greeting.md` declara `forbids: ['unsafe']`. Sin esto
# la prohibicion era decorativa: nada la impedia (lo detecto `audit_forbids.py` con
# FORBID_UNSAFE_UNENFORCED). Declarado aca, rustc la impone sobre el crate entero,
# no sobre un archivo. Mismo criterio que Topcoat, que lo pone en su workspace.
[lints.rust]
unsafe_code = "deny"

[[test]]
name = "format_greeting"
path = "tests_rs/format_greeting.rs"
